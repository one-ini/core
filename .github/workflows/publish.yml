name: Publish

on:
  release:
    types: [published]
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Preserve line endings
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Install latest rust stable
        run: rustup toolchain install stable
      - name: Install wasm-pack
        run: curl https://wasm-bindgen.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
      - name: Build wasm/js package
        run: |
          cargo clean
          wasm-pack build --release --scope one-ini --target nodejs
      - name: Publish to npm
        run: |
          npm pkg set name='@one-ini/wasm'
          npm pack --dry-run
          npm publish --access public --provenance
        working-directory: pkg
